services:
  web:
    build: .
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?set ALLOWED_HOSTS in .env}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?set CSRF_TRUSTED_ORIGINS in .env}
      DATABASE_PATH: /data/db.sqlite3
      MEDIA_ROOT: /data/media
    volumes:
      - ./data:/data
    expose:
      - "8000"
    networks:
      - app

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    networks:
      - app

  # Serves user-uploaded photos. Only reachable from the edge proxy; kept
  # separate so Gunicorn never handles media requests.
  media:
    image: caddy:2
    restart: unless-stopped
    command: caddy run --config /etc/caddy/Caddyfile.media --adapter caddyfile
    volumes:
      - ./Caddyfile.media:/etc/caddy/Caddyfile.media:ro
      - ./data/media:/srv/media:ro
    networks:
      - app

volumes:
  caddy_data:
  caddy_config:

networks:
  app:
